syntax = "proto3";

package gocraft.abi.v1;

import "abi/v1/options.proto";

option go_package = "github.com/GoCraft-MC/gocraft-abi/abi/v1/wire;wire";
option java_package = "fr.gocraft.abi.v1";
option java_outer_classname = "EventsProto";
option java_multiple_files = true;

// Native events, declared once.
//
// Writing each of these by hand would mean writing it four times — Go, Java,
// Lua, docs — and watching all four drift by month three. protoc-gen-gocraft
// reads this file and emits every side from it, in one commit, which is what
// makes "a Lua event and a Java event come out of the same source" true rather
// than aspirational.
//
// **These messages are never serialised.** The envelope carries an event as a
// type name and a positional list of Values (§20.4), because a wire format that
// carried field names would have to agree on them across every language and
// would break every runtime the day one was renamed. What this file declares is
// the *layout*: field 1 is at index 0, field 2 at index 1, and the generator
// emits named accessors over that agreement on both sides. Declaration order is
// therefore load-bearing — reordering fields is a wire break even though
// nothing here moves.

// ── Vocabulary ────────────────────────────────────────────────────────────────
//
// The types events are built from. Hand-written in each language, where
// ergonomics matter and generated code would be mediocre; declared here so the
// generator knows how to read one out of a positional payload.

message PlayerRef {
  bytes uuid = 1;
  string username = 2;
  // "java" or "bedrock". A plugin should rarely care, and the one place it
  // does is deciding what a client can render.
  string edition = 3;
}

message BlockPos {
  sint64 x = 1;
  sint64 y = 2;
  sint64 z = 3;
}

message Block {
  // Namespaced, as the registries spell it: "minecraft:oak_stairs".
  string id = 1;
  // The full state rather than a handle to re-resolve. A handler that had to
  // ask the server what it was just given would pay a round trip inside an
  // event that is blocking the tick.
  map<string, string> properties = 2;
}

// ── Events ────────────────────────────────────────────────────────────────────

message BlockBreak {
  option (gocraft.abi.v1.event) = {
    type: "block.break"
    cancellable: true
    phase: PHASE_TICK_BLOCKING
    on_failure: FAILURE_POLICY_ALLOW
    effects: ["message"]
    since: 1
  };

  PlayerRef player = 1;
  BlockPos pos = 2;
  Block block = 3;
  // The item in hand, namespaced. Empty when breaking bare-handed.
  string tool = 4;
  // Resolved by the host before dispatch, for every node the manifest
  // subscribed to. A handler asking about one never pays a round trip — which
  // matters because it is holding the tick while it asks.
  map<string, bool> perms = 5 [(gocraft.abi.v1.injected) = true];
}

message PlayerJoin {
  option (gocraft.abi.v1.event) = {
    type: "player.join"
    cancellable: false
    phase: PHASE_OBSERVATIONAL
    on_failure: FAILURE_POLICY_ALLOW
    effects: ["message"]
    since: 1
  };

  PlayerRef player = 1;
  map<string, bool> perms = 2 [(gocraft.abi.v1.injected) = true];
}

// Fired only after a valid placement has been computed, before any block or
// item changes. Multi-block structures produce one event for the primary block.
message BlockPlace {
  option (gocraft.abi.v1.event) = { type: "block.place" cancellable: true
    phase: PHASE_TICK_BLOCKING on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  BlockPos pos = 2;
  Block block = 3;
  Block replaced = 4;
  sint64 dimension = 5;
  map<string, bool> perms = 6 [(gocraft.abi.v1.injected) = true];
}

message PlayerQuit {
  option (gocraft.abi.v1.event) = { type: "player.quit"
    phase: PHASE_OBSERVATIONAL on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  string reason = 2;
}

// The unformatted chat text, before broadcasting. A rewritten message is
// never reinterpreted as a command.
message PlayerChat {
  option (gocraft.abi.v1.event) = { type: "player.chat" cancellable: true
    phase: PHASE_TICK_BLOCKING on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  string message = 2 [(gocraft.abi.v1.mutable) = true];
  map<string, bool> perms = 3 [(gocraft.abi.v1.injected) = true];
}

// Permissions and argument parsing run AFTER plugins rewrite the command.
message PlayerCommand {
  option (gocraft.abi.v1.event) = { type: "player.command" cancellable: true
    phase: PHASE_TICK_BLOCKING on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  string command = 2 [(gocraft.abi.v1.mutable) = true];
  map<string, bool> perms = 3 [(gocraft.abi.v1.injected) = true];
}

// Damage entering the player's health pipeline, before resistance and
// absorption. Armour already applied by the caller is not applied again.
message PlayerDamage {
  option (gocraft.abi.v1.event) = { type: "player.damage" cancellable: true
    phase: PHASE_TICK_BLOCKING on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  double damage = 2 [(gocraft.abi.v1.mutable) = true];
  string cause = 3;
  map<string, bool> perms = 4 [(gocraft.abi.v1.injected) = true];
}

message PlayerDeath {
  option (gocraft.abi.v1.event) = { type: "player.death"
    phase: PHASE_OBSERVATIONAL on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  string cause = 2;
}

// Notification after a dead player has successfully respawned.
message PlayerRespawn {
  option (gocraft.abi.v1.event) = { type: "player.respawn"
    phase: PHASE_OBSERVATIONAL on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  double x = 2;
  double y = 3;
  double z = 4;
  sint64 dimension = 5;
}

message PlayerTeleport {
  option (gocraft.abi.v1.event) = { type: "player.teleport" cancellable: true
    phase: PHASE_TICK_BLOCKING on_failure: FAILURE_POLICY_ALLOW since: 1 };
  PlayerRef player = 1;
  double from_x = 2;
  double from_y = 3;
  double from_z = 4;
  double x = 5 [(gocraft.abi.v1.mutable) = true];
  double y = 6 [(gocraft.abi.v1.mutable) = true];
  double z = 7 [(gocraft.abi.v1.mutable) = true];
  sint64 dimension = 8;
  map<string, bool> perms = 9 [(gocraft.abi.v1.injected) = true];
}

// An attempted main-hand block/entity interaction. Cancelling prevents the
// associated use/boarding/trade action; it does not describe an attack.
message PlayerInteract {
  option (gocraft.abi.v1.event) = { type: "player.interact" cancellable: true
    phase: PHASE_TICK_BLOCKING on_failure: FAILURE_POLICY_ALLOW since: 1 };
